backend:
  name: github
  repo: rthasan2004/olivia
  branch: main
media_folder: images
public_folder: /images
collections:
  - name: blog
    label: Blog
    files:
      - name: posts
        label: Posts
        file: content/posts.json
        format: json
        fields:
          - label: Posts
            name: posts
            widget: list
            add_to_top: true
            summary: "{{fields.date}} · {{fields.title}}"
            fields:
              - {label: Title, name: title, widget: string}
              - {label: Category, name: cat, widget: select, options: [Fashion, Nails, Style tips, Trends]}
              - {label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false}
              - {label: Cover colour, name: color, widget: color, default: "#7a2e6e"}
              - {label: Text, name: body, widget: text, hint: "Leave a blank line between paragraphs"}
