<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><meta name="color-scheme" content="light"><title>Olivia Idea Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fcf7f4;color:#2b2222;font:16px/1.6 system-ui,sans-serif}
.w{max-width:680px;margin:0 auto;padding:20px}
h1{font:700 30px Georgia,serif;margin:0 0 4px;color:#b5636e}
.box{background:#fff;border:1px solid #eadbd8;border-radius:16px;padding:18px;margin:16px 0}
label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
input,select,textarea{width:100%;font:inherit;padding:10px;border:1.5px solid #eadbd8;border-radius:10px;background:#fff}
textarea{min-height:200px}input[type=color]{width:80px;height:44px;padding:2px}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:10px 22px;background:#c9747f;color:#fff;cursor:pointer;margin:14px 8px 0 0}
button.g{background:none;color:#2b2222;border:1.5px solid #eadbd8}button.s{padding:4px 14px;margin:0 0 0 6px;font-size:14px}button.d{color:#b3261e;border-color:#b3261e}
.r{display:flex;gap:10px;flex-wrap:wrap}.r>div{flex:1;min-width:130px}
ul{margin:0;padding:0}li{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px dashed #eadbd8}
small{color:#7d6b6b;display:block}.m{color:#7d6b6b;margin-top:10px}img.pv{max-width:140px;border-radius:8px;display:block;margin-top:8px}
</style></head>
<body><div class="w" id="a"></div>
<script>
var a=document.getElementById("a"),pw=sessionStorage.getItem("pw")||"",P=[],ed=null,img="",dl=null,note="";
var CATS=["Fashion","Nails","Style tips","Trends"];
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
async function api(path,opt){opt=opt||{};opt.headers={"x-admin-password":pw,"content-type":"application/json"};var r=await fetch("/api/"+path,opt);var d=await r.json().catch(function(){return{}});if(!r.ok)throw new Error(d.error||"Error "+r.status);return d}
function login(msg){
  a.innerHTML='<h1>Olivia Idea Admin</h1><div class="box"><label for="p">Password</label><input id="p" type="password" autocomplete="current-password"><button id="go">Log in</button><div class="m">'+esc(msg||"")+'</div></div>';
  document.getElementById("go").onclick=async function(){pw=document.getElementById("p").value;try{await api("login",{method:"POST"});sessionStorage.setItem("pw",pw);start()}catch(e){login(e.message)}};
}
async function start(){
  try{var d=await api("posts");
    if(d===null){try{d=(await(await fetch("/content/posts.json")).json()).posts||[]}catch(e){d=[]}}
    P=d;panel();
  }catch(e){login(e.message)}
}
function shrink(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext("2d").drawImage(i,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.82))};i.onerror=no;i.src=r.result};r.onerror=no;r.readAsDataURL(f)})}
function sorted(){return P.map(function(p,i){return{p:p,i:i}}).sort(function(x,y){return x.p.date<y.p.date?1:-1})}
function panel(){
  var e=ed!==null?P[ed]:null;
  a.innerHTML='<h1>Olivia Idea Admin</h1><div class="m"><a href="/" target="_blank">View site</a> · <a href="#" id="out">Log out</a></div>'
  +'<div class="box"><b>'+(e?"Edit post":"New post")+'</b>'
  +'<label for="t">Title</label><input id="t" value="'+esc(e?e.title:"")+'">'
  +'<div class="r"><div><label for="c">Category</label><select id="c">'+CATS.map(function(c){return '<option'+(e&&e.cat===c?" selected":"")+'>'+c+'</option>'}).join("")+'</select></div>'
  +'<div><label for="d">Date</label><input id="d" type="date" value="'+(e?e.date:new Date().toISOString().slice(0,10))+'"></div>'
  +'<div><label for="k">Cover colour</label><input id="k" type="color" value="'+(e?e.color:"#c9747f")+'"></div></div>'
  +'<label for="f">Image (optional)</label><input id="f" type="file" accept="image/*"><div class="m" id="fs"></div><img class="pv" id="pv" alt=""'+(img?' src="'+esc(img)+'"':' hidden')+'>'
  +'<label for="b">Post text (blank line between paragraphs)</label><textarea id="b">'+esc(e?e.body:"")+'</textarea>'
  +'<button id="pub">'+(e?"Save changes":"Publish post")+'</button>'+(e?'<button class="g" id="cx">Cancel</button>':"")
  +'<div class="m" id="msg">'+esc(note)+'</div></div>'
  +'<div class="box"><b>All posts ('+P.length+')</b><ul>'+sorted().map(function(o){return '<li><span>'+esc(o.p.title)+'<small>'+o.p.date+' · '+esc(o.p.cat)+'</small></span><span><button class="g s" data-e="'+o.i+'">Edit</button><button class="g s d" data-x="'+o.i+'">'+(dl===o.i?"Confirm":"Delete")+'</button></span></li>'}).join("")+'</ul></div>';
  document.getElementById("out").onclick=function(ev){ev.preventDefault();sessionStorage.removeItem("pw");pw="";login()};
  document.getElementById("pub").onclick=save;
  var cx=document.getElementById("cx");if(cx)cx.onclick=function(){ed=null;img="";note="";panel()};
  document.getElementById("f").onchange=async function(){
    var f=this.files[0],fs=document.getElementById("fs");if(!f)return;fs.textContent="Uploading…";
    try{var data=await shrink(f);var r=await api("img",{method:"POST",body:JSON.stringify({data:data})});img=r.url;var pv=document.getElementById("pv");pv.src=data;pv.hidden=false;fs.textContent="Image ready."}catch(er){fs.textContent="Upload failed: "+er.message}
  };
  [].forEach.call(a.querySelectorAll("[data-e]"),function(b){b.onclick=function(){ed=+b.dataset.e;img=P[ed].image||"";note="";panel();window.scrollTo(0,0)}});
  [].forEach.call(a.querySelectorAll("[data-x]"),function(b){b.onclick=function(){var i=+b.dataset.x;if(dl!==i){dl=i;panel();return}P.splice(i,1);dl=null;ed=null;img="";push("Deleted.")}});
}
async function push(m){note="Saving…";panel();try{await api("posts",{method:"PUT",body:JSON.stringify(P)});note=m}catch(e){note="Error: "+e.message}panel()}
function save(){
  var t=document.getElementById("t").value.trim(),b=document.getElementById("b").value.trim();
  if(!t||!b){note="Add a title and text first.";panel();return}
  var rec={title:t,cat:document.getElementById("c").value,date:document.getElementById("d").value,color:document.getElementById("k").value,body:b};
  if(img)rec.image=img;
  if(ed!==null)P[ed]=rec;else P.push(rec);
  ed=null;img="";push("Saved. It is live on the site now.");
}
if(pw)api("login",{method:"POST"}).then(start).catch(function(){login()});else login();
</script></body></html>
